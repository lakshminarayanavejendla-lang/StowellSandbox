<!-- Portal shell (Portal Responsive Display Standard): sidebar / navigation, top bar, workspace and application launcher are separate
     components under core/layout; this component only composes them and owns the open/close state of the drawer and launcher. -->
<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="layout-wrapper">
  <app-sidebar
    [open]="navOpen"
    [profileName]="profileName"
    [profileRole]="profileRole"
    [photoUrl]="profilePhotoUrl"
    (linkClicked)="closeNav()"
  ></app-sidebar>

  <!-- Dims the page behind the navigation drawer (below 1024px, or while Auto-hide is on) -->
  @if (navOpen) {
    <div class="nav-backdrop" (click)="closeNav()"></div>
  }

  <div class="main-area">
    <app-topbar [showMenu]="sidebarState.autoHide()" (menuToggle)="toggleNav()" (launcherToggle)="toggleRightMenu()"></app-topbar>

    <div class="content-right-wrapper">
      <app-workspace>
        <router-outlet></router-outlet>
      </app-workspace>

      @if (rightMenuOpen) {
        <app-launcher></app-launcher>
      }
    </div>

    <footer>
      <a href="#">About</a>
      <a href="#">License</a>
      <a href="#">Documentation</a>
      <a href="https://wrapbootstrap.com/user/MyOrange" target="_blank" rel="noopener" aria-label="Help"><i class="fas fa-question-circle" aria-hidden="true"></i></a>
    </footer>
  </div>
</div>
