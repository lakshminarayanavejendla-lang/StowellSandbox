<app-page-header [title]="'Document Management' + (jobName ? ' - ' + jobName : '')" [breadcrumbs]="[{ label: 'Document Management' }]"></app-page-header>

@if (notFound) {
  <div class="not-found">Could not resolve a document folder for project "{{ projectId }}".</div>
} @else if (!isResolved) {
  <p>Loading project details...</p>
} @else {
  <app-file-browser [scope]="'project'" [folder]="folderName"></app-file-browser>
}
