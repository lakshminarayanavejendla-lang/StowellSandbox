<div class="file-browser">
  @if (ajaxSettings) {
    <ejs-filemanager
      [ajaxSettings]="ajaxSettings"
      [navigationPaneSettings]="{ minWidth: '260px', maxWidth: '55%' }"
      height="520px"
      (fileOpen)="onFileOpen($event)"
      (beforeSend)="onBeforeSend($event)"
    ></ejs-filemanager>
  } @else {
    <div class="loading">Loading file manager...</div>
  }
</div>
