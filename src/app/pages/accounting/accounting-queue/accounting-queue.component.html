@if (isLoading) {
  <div class="spinner">Loading...</div>
} @else {
  <h3>Active Projects</h3>
  <hr />
  <div class="toolbar">
    <div class="search-box">
      <i class="bi bi-search"></i>
      <input
        type="text"
        placeholder="Search accounting..."
        [value]="searchTerm"
        (input)="onSearchChange($any($event.target).value)"
      />
    </div>
  </div>

  <ejs-grid
  class="black-grid"
    [dataSource]="filteredItems"
    [allowPaging]="true"
    [allowSorting]="true"
    [allowFiltering]="true"
    [pageSettings]="pageSettings"
  >
    <e-columns>
      <e-column field="jobID" headerText="Job ID" width="110">
        <ng-template #template let-data>
          <a [routerLink]="queueLink(data)" class="opportunity-link">{{ data.jobID }}</a>
        </ng-template>
      </e-column>
      <e-column field="jobName" headerText="Job Name" width="180"></e-column>
      <e-column field="address" headerText="Address" width="200"></e-column>
      <e-column field="submitter" headerText="Submitter" width="140"></e-column>
      <e-column field="jobType" headerText="Type" width="110"></e-column>
    </e-columns>
  </ejs-grid>
}
