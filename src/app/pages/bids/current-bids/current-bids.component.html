<app-page-header title="Current Bids" [breadcrumbs]="[{ label: 'Bid Management' }, { label: 'Current Bids' }]">
  <a actions class="btn btn-primary" routerLink="/bids/new-bid">New Bid</a>
</app-page-header>

<app-kpi-cards [items]="kpis"></app-kpi-cards>

<div class="toolbar">
  <div class="search-box">
    <i class="bi bi-search"></i>
    <input
      type="text"
      placeholder="Search Bids..."
      [value]="searchTerm"
      (input)="onSearchChange($any($event.target).value)"
    />
  </div>
</div>

<ejs-grid
class="black-grid"
  [dataSource]="filteredBids"
  [allowPaging]="true"
  [allowSorting]="true"
  [allowFiltering]="true"
  [pageSettings]="pageSettings"
>
  <e-columns>
    <e-column field="BidId" headerText="Bid ID" width="130">
      <ng-template #template let-data>
        <a [routerLink]="['/bids/bid-overview', data.bidId, 'current']"  class="opportunity-link">{{ data.bidId }}</a>
      </ng-template>
    </e-column>
    <e-column field="BidName" headerText="Bid Name" width="200"></e-column>
    <!-- "Bid Manager" here shows the Bidder field, but the Bid Queue's column shows BidManager.
         That difference comes from Blazor and is kept on each page. -->
    <e-column field="Bidder" headerText="Bid Manager" width="180"></e-column>
    <e-column field="Status" headerText="Status" width="120"></e-column>
  </e-columns>
</ejs-grid>
