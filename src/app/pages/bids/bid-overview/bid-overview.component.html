<h3>Opportunity Overview</h3>
<hr />

<ul class="nav-tabs">
  <li>
    <a [class.active]="activeTab === 'overview'" (click)="switchTab('overview')">
      <i class="fas fa-chart-column"></i> Overview
    </a>
  </li>
  <li>
    <a [class.active]="activeTab === 'details'" (click)="switchTab('details')">
      <i class="fas fa-clipboard-list"></i> Details
    </a>
  </li>
  <li>
    <a [class.active]="activeTab === 'documents'" (click)="switchTab('documents')">
      <i class="fas fa-folder"></i> Documents
    </a>
  </li>
</ul>

<div class="tab-content">
  @switch (activeTab) {
    @case ('overview') {
      <app-bid-summary-tab [bidId]="bidId" [type]="type" [bidRecord]="bidRecord" (bidChanged)="loadBid()" />
    }
    @case ('details') {
      <app-bid-details-tab [bidId]="bidId" [type]="type" [bidRecord]="bidRecord" (bidChanged)="loadBid()" />
    }
    @case ('documents') {
      <app-bid-file-manager [bidId]="bidId" />
    }
  }
</div>
