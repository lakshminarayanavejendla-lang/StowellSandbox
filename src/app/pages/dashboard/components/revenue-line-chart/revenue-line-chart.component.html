<h4>Retain Amount Across Files</h4>
<ejs-chart [primaryXAxis]="primaryXAxis" [primaryYAxis]="primaryYAxis" height="320px">
  <e-series-collection>
    <e-series
      [dataSource]="chartData"
      type="Line"
      xName="category"
      yName="value"
      [name]="seriesName"
      dashArray="5,5"
    ></e-series>
  </e-series-collection>
</ejs-chart>
