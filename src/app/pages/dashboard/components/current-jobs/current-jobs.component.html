<div class="toolbar">
  <div class="search-box">
    <i class="bi bi-search"></i>
    <input
      type="text"
      placeholder="Search jobs..."
      [value]="searchTerm"
      (input)="onSearchChange($any($event.target).value)"
    />
  </div>
</div>

<!-- Real Syncfusion Grid replacing the old plain <table>. `filteredJobs` (the existing
     client-side search result) feeds [dataSource] directly; paging/sorting are the grid's own
     built-in features (PageService/SortService registered in the component's providers). -->
<ejs-grid
class="black-grid"
  [dataSource]="filteredJobs"
  [allowPaging]="true"
  [allowSorting]="true"
  [pageSettings]="pageSettings"
  height="360"
>
  <e-columns>
    <e-column field="jobID" headerText="Job ID" width="140">
      <!-- Column template - Syncfusion's documented pattern for Angular Grid column templates
           is `<ng-template #template let-data>` inside `<e-column>`; `data` is the row object. -->
      <ng-template #template let-data>
        <a [routerLink]="['/project-management/project-overview', data.jobID]" class="opportunity-link">{{ data.jobID }}</a>
      </ng-template>
    </e-column>
    <e-column field="jobName" headerText="Job Name"></e-column>
  </e-columns>
</ejs-grid>
