<h4>Total Retain by File (Hi/Low Highlight)</h4>
@if (chartData.length) {
  <ejs-chart
    [theme]="chartTheme()"
    background="transparent"
    [chartArea]="chartArea"
    [primaryXAxis]="primaryXAxis"
    [primaryYAxis]="primaryYAxis"
    [legendSettings]="legendSettings"
    [tooltip]="tooltip"
    (axisLabelRender)="onAxisLabel($event)"
    (tooltipRender)="onTooltip($event)"
    (textRender)="onDataLabel($event)"
    height="340px"
  >
    <e-series-collection>
      <e-series [dataSource]="chartData" type="StackingColumn" xName="category" yName="regular" name="Regular" [fill]="colors.blue" columnWidth="0.62"></e-series>
      <e-series [dataSource]="chartData" type="StackingColumn" xName="category" yName="highest" name="Highest" [fill]="colors.accent" [marker]="marker" [cornerRadius]="rounded" columnWidth="0.62"></e-series>
      <e-series [dataSource]="chartData" type="StackingColumn" xName="category" yName="lowest" name="Lowest" [fill]="colors.slate" [marker]="marker" [cornerRadius]="rounded" columnWidth="0.62"></e-series>
    </e-series-collection>
  </ejs-chart>
} @else {
  <div class="chart-empty">No data to chart yet.</div>
}
