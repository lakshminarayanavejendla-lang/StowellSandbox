<app-page-header title="Project Budget Configuration"></app-page-header>

<div class="gridcard">
  <div class="toolbar">
    <input
      type="text"
      placeholder="Search..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange($event)"
    />
  </div>

  <ejs-grid
  class="black-grid"
    [dataSource]="filteredItems"
    [allowPaging]="true"
    [allowSorting]="true"
    [allowFiltering]="true"
    [pageSettings]="pageSettings"
  >
    <e-columns>
      <e-column field="jobID" headerText="JobID" width="110">
        <ng-template #template let-data>
          <a [routerLink]="linkFor(data)" class="opportunity-link">{{ data.jobID }}</a>
        </ng-template>
      </e-column>
      <e-column field="jobName" headerText="Job Name" width="180"></e-column>
      <e-column field="address" headerText="Address" width="200"></e-column>
      <e-column field="phase" headerText="Phase" width="110"></e-column>
    </e-columns>
  </ejs-grid>
</div>
