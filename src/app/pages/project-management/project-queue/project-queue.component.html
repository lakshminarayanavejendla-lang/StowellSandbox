<app-page-header title="Active Projects" [breadcrumbs]="[{ label: 'Project Management' }, { label: 'Project Queue' }]">
  <a actions class="doclibrary" href="/DocManagement/Main" target="_blank" rel="noopener"><i class="bi bi-folder me-1"></i> Project Document Library</a>
</app-page-header>
<app-kpi-cards [items]="kpis"></app-kpi-cards>

<div class="gridcard">
  <div class="toolbar">
    <input
      type="text"
      placeholder="Search..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange($event)"
    />
  </div>

  <ejs-grid
    class="black-grid"
    [dataSource]="filteredCostCodes"
    [allowPaging]="true"
    [allowSorting]="true"
    [allowFiltering]="true"
    [pageSettings]="pageSettings"
  >
    <e-columns>
      <e-column field="recNum" hideAtMedia="(min-width: 1024px)" headerText="Rec Num" width="100">
        <ng-template #template let-data>
          <a [routerLink]="['/project-management/project-overview', data.recNum]" class="opportunity-link">{{ data.recNum }}</a>
        </ng-template>
      </e-column>
      <e-column field="jobNumber" headerText="Job Number" width="120"></e-column>
      <e-column field="address" headerText="Address" width="200"></e-column>
      <e-column field="city" hideAtMedia="(min-width: 1024px)" headerText="City" width="120"></e-column>
      <e-column field="state" hideAtMedia="(min-width: 1024px)" headerText="State" width="90"></e-column>
      <e-column field="zipCode" hideAtMedia="(min-width: 1024px)" headerText="ZipCode" width="100"></e-column>
    </e-columns>
  </ejs-grid>
</div>

<div class="card-header">
  <h4 class="m-0">Pending Projects</h4>
  <a class="doclibrary" href="/DocManagement/Main" target="_blank">
    <i class="bi bi-folder me-1"></i>
    Project Document Library
  </a>
</div>

<div class="gridcard">
  <!-- BidItem's fields (JobID, BidDate, Address, Submitter) are guessed from this template only
       (see cost-code.model.ts). -->
  <ejs-grid
  class="black-grid"
    [dataSource]="filteredBids"
    [allowPaging]="true"
    [allowSorting]="true"
    [allowFiltering]="true"
    [pageSettings]="pageSettings"
  >
    <e-columns>
      <e-column field="jobID" headerText="Project Number" width="130">
        <ng-template #template let-data>
          <!-- Opens estimation/edit-bid/:jobId, the Edit Project page. The old Blazor route
               /Estimation/EditBidForm/ gave a 404 (see overview-tab.component.html). -->
          <a [routerLink]="['/estimation/edit-bid', data.jobID]" class="opportunity-link">{{ data.jobID }}</a>
        </ng-template>
      </e-column>
      <e-column field="bidDate" headerText="Bid Date" width="110">
        <ng-template #template let-data>{{ data.bidDate | date: 'MM/dd/yyyy' }}</ng-template>
      </e-column>
      <e-column field="address" headerText="Project" width="200"></e-column>
      <e-column field="submitter" hideAtMedia="(min-width: 768px)" headerText="Submitter" width="140"></e-column>
    </e-columns>
  </ejs-grid>
</div>
