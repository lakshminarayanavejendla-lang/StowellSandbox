<div class="card-header">
  <h4 class="m-0">Active Projects</h4>
  <a class="doclibrary" href="/DocManagement/Main" target="_blank">
    <i class="bi bi-folder me-1"></i>
    Project Document Library
  </a>
</div>

<div class="gridcard">
  <div class="toolbar">
    <input
      type="text"
      placeholder="Search..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange($event)"
    />
  </div>

  <ejs-grid
    class="black-grid"
    [dataSource]="filteredCostCodes"
    [allowPaging]="true"
    [allowSorting]="true"
    [allowFiltering]="true"
    [pageSettings]="pageSettings"
  >
    <e-columns>
      <e-column field="recNum" headerText="Rec Num" width="100">
        <ng-template #template let-data>
          <a [routerLink]="['/project-management/project-overview', data.recNum]" class="opportunity-link">{{ data.recNum }}</a>
        </ng-template>
      </e-column>
      <e-column field="jobNumber" headerText="Job Number" width="120"></e-column>
      <e-column field="address" headerText="Address" width="200"></e-column>
      <e-column field="city" headerText="City" width="120"></e-column>
      <e-column field="state" headerText="State" width="90"></e-column>
      <e-column field="zipCode" headerText="ZipCode" width="100"></e-column>
    </e-columns>
  </ejs-grid>
</div>

<div class="card-header">
  <h4 class="m-0">Pending Projects</h4>
  <a class="doclibrary" href="/DocManagement/Main" target="_blank">
    <i class="bi bi-folder me-1"></i>
    Project Document Library
  </a>
</div>

<div class="gridcard">
  <!-- FLAG: BidItem's fields (JobID/BidDate/Address/Submitter) are inferred from this template
       only - see core/models/project-management/cost-code.model.ts. -->
  <ejs-grid
  class="black-grid"
    [dataSource]="filteredBids"
    [allowPaging]="true"
    [allowSorting]="true"
    [allowFiltering]="true"
    [pageSettings]="pageSettings"
  >
    <e-columns>
      <e-column field="jobID" headerText="Project Number" width="130">
        <ng-template #template let-data>
          <!-- FIX (2026-09-16) - was '/Estimation/EditBidForm/' + jobID, the dead Blazor route
               (404). BidFormComponent at estimation/edit-bid/:jobId is the real, already-built
               port of that page - see overview-tab.component.html for the fuller comment. -->
          <a [routerLink]="['/estimation/edit-bid', data.jobID]" class="opportunity-link">{{ data.jobID }}</a>
        </ng-template>
      </e-column>
      <e-column field="bidDate" headerText="Bid Date" width="110">
        <ng-template #template let-data>{{ data.bidDate | date: 'MM/dd/yyyy' }}</ng-template>
      </e-column>
      <e-column field="address" headerText="Project" width="200"></e-column>
      <e-column field="submitter" headerText="Submitter" width="140"></e-column>
    </e-columns>
  </ejs-grid>
</div>
